<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMind - Smart Music Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <h1 class="text-2xl font-bold text-primary">
                            <i class="fas fa-music mr-2"></i>MelodyMind
                        </h1>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/about.html" class="text-gray-600 hover:text-primary px-3 py-2 rounded-md text-sm font-medium">
                        <i class="fas fa-info-circle mr-1"></i>About
                    </a>
                    <button id="darkModeToggle" class="p-2 rounded-lg hover:bg-gray-100">
                        <i class="fas fa-moon text-gray-600"></i>
                    </button>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-2">
                            <i class="fas fa-user text-blue-500"></i>
                            <span id="userId" class="text-sm font-medium">Loading...</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <i class="fas fa-heart text-red-500"></i>
                            <span id="favoriteCount" class="text-sm font-medium">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header Section -->
        <div class="text-center mb-8">
            <h2 class="text-4xl font-bold text-gray-900 mb-4">Discover Your Perfect Sound</h2>
            <p class="text-xl text-gray-600 max-w-2xl mx-auto">
                AI-powered music recommendations tailored to your mood and preferences
            </p>
        </div>

        <!-- Filter Section -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">
                <i class="fas fa-filter mr-2 text-primary"></i>Find Your Music
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Genre</label>
                    <select id="genreFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">All Genres</option>
                        <option value="pop">Pop</option>
                        <option value="rock">Rock</option>
                        <option value="hip-hop">Hip Hop</option>
                        <option value="electronic">Electronic</option>
                        <option value="jazz">Jazz</option>
                        <option value="classical">Classical</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Language</label>
                    <select id="languageFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">All Languages</option>
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Region</label>
                    <select id="regionFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">All Regions</option>
                        <option value="US">United States</option>
                        <option value="UK">United Kingdom</option>
                        <option value="CA">Canada</option>
                        <option value="AU">Australia</option>
                        <option value="DE">Germany</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Mood</label>
                    <select id="moodFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">All Moods</option>
                        <option value="happy">Happy</option>
                        <option value="sad">Sad</option>
                        <option value="energetic">Energetic</option>
                        <option value="chill">Chill</option>
                        <option value="focus">Focus</option>
                        <option value="romantic">Romantic</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="searchBtn" class="w-full bg-primary hover:bg-primary-600 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
                        <i class="fas fa-search mr-2"></i>Search
                    </button>
                </div>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="flex space-x-1 mb-6">
            <button id="recommendationsTab" class="tab-button active px-6 py-3 rounded-lg font-medium transition duration-200">
                <i class="fas fa-magic mr-2"></i>Recommendations
            </button>
            <button id="trendingTab" class="tab-button px-6 py-3 rounded-lg font-medium transition duration-200">
                <i class="fas fa-fire mr-2"></i>Trending
            </button>
            <button id="favoritesTab" class="tab-button px-6 py-3 rounded-lg font-medium transition duration-200">
                <i class="fas fa-heart mr-2"></i>Favorites
            </button>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
            <p class="mt-4 text-gray-600">Loading your music...</p>
        </div>

        <!-- Songs Grid -->
        <div id="songsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Songs will be dynamically loaded here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12">
            <i class="fas fa-music text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-xl font-semibold text-gray-600 mb-2">No songs found</h3>
            <p class="text-gray-500">Try adjusting your filters or search criteria</p>
        </div>
    </div>

    <!-- Modals -->
    <!-- Lyrics Modal -->
    <div id="lyricsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-96 overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-semibold text-gray-900">
                        <i class="fas fa-quote-left mr-2 text-primary"></i>Lyrics
                    </h3>
                    <button id="closeLyricsModal" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div id="lyricsContent" class="text-gray-700 whitespace-pre-line">
                    <!-- Lyrics content will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Chords Modal -->
    <div id="chordsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-96 overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-semibold text-gray-900">
                        <i class="fas fa-music mr-2 text-primary"></i>Piano Chords
                    </h3>
                    <button id="closeChordsModal" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div id="chordsContent" class="text-gray-700 whitespace-pre-line font-mono">
                    <!-- Chords content will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
